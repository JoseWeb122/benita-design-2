<!doctype html>
<html lang="en" data-theme="espresso">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Benita Bar Co. — private bartending, handcrafted cocktails and bespoke mobile bars for weddings, birthdays, corporate gatherings and upscale celebrations."
    />
    <meta name="theme-color" content="#281914" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23281914'/%3E%3Cpath d='M7 9h18l-8 9v7M12 25h8' stroke='%23C7A477' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='20.5' cy='13.5' r='1.4' fill='%23C7A477'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Manrope:wght@200..800&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("benita-theme");
          if (t === "plum" || t === "espresso") document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <style>
      html {
        background: #281914;
      }
      html[data-theme="plum"] {
        background: #351b32;
      }
    </style>
    <title>Benita Bar Co. — Private Bartending & Luxury Mobile Bar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
